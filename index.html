<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
 --t-pri:#00796B; --t-sec:#26A69A; --t-fill:#E0F2F1; --t-acc:#FF7043;
 --p-pri:#5E35B1; --p-sec:#9575CD; --p-fill:#EDE7F6; --p-acc:#FFB300;
 --ink:#263238; --bg:#FAFAFA; --green:#43A047; --white:#FFFFFF;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Nunito',Verdana,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh;}
h1,h2,h3,.btn{font-family:'Fredoka','Comic Sans MS',sans-serif;}
.wrap{max-width:860px; margin:0 auto; padding:24px 16px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.topbar h1{color:var(--t-pri); font-size:2rem;}
.pill{background:var(--t-pri); color:var(--white); border-radius:999px; padding:6px 14px; font-weight:800; font-size:.75rem; letter-spacing:.05em;}
.pill.purple{background:var(--p-pri);} .pill.gold{background:var(--p-acc); color:var(--ink);}
.card{background:var(--t-fill); border-radius:16px; padding:20px; margin-bottom:14px;}
.card.purple{background:var(--p-fill);}
.intro{font-size:1.05rem; margin-bottom:20px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
.topic{background:var(--t-fill); border:none; border-radius:16px; padding:18px; text-align:left; cursor:pointer; transition:transform .12s;}
.topic:hover{transform:translateY(-3px);}
.topic .emoji{font-size:1.8rem;}
.topic h3{color:var(--t-pri); margin:6px 0 4px; font-size:1.05rem;}
.topic p{font-size:.85rem;}
.topic .done{color:var(--green); font-weight:800; font-size:.8rem; margin-top:6px;}
.progress{display:flex; gap:6px; margin:14px 0;}
.dot{width:12px; height:12px; border-radius:50%; background:#CFD8DC;}
.dot.on{background:var(--t-pri);} .dot.on.purple{background:var(--p-pri);}
.dot.right{background:var(--green);} .dot.wrong{background:var(--t-acc);}
.qhead{font-size:.85rem; font-weight:800; letter-spacing:.04em; margin-bottom:6px;}
.qhead.teal{color:var(--t-pri);} .qhead.purple{color:var(--p-pri);}
.question{font-size:1.2rem; font-weight:700; margin-bottom:16px; line-height:1.5;}
.opts{display:grid; gap:10px;}
.opt{background:var(--white); border:2px solid #ECEFF1; border-radius:12px; padding:13px 16px; font-size:1rem; font-family:'Nunito',Verdana,sans-serif; text-align:left; cursor:pointer; transition:border .12s;}
.opt:hover{border-color:var(--t-sec);}
.opt.picked-right{border-color:var(--green); background:#E8F5E9; font-weight:800;}
.opt.picked-wrong{border-color:var(--t-acc); background:#FBE9E7;}
.opt.reveal{border-color:var(--green); background:#E8F5E9;}
.opt:disabled{cursor:default; opacity:.92;}
.why{border-radius:12px; padding:14px 16px; margin-top:14px; font-size:.98rem; display:none;}
.why.good{background:#E8F5E9; border-left:6px solid var(--green);}
.why.oops{background:#FFF3E0; border-left:6px solid var(--t-acc);}
.btn{border:none; border-radius:999px; padding:12px 28px; font-size:1.05rem; font-weight:600; cursor:pointer; color:var(--white); background:var(--t-pri); margin-top:16px;}
.btn.purple{background:var(--p-pri);} .btn.ghost{background:#B0BEC5;}
.btn:hover{filter:brightness(1.08);}
.center{text-align:center;}
.levelup{background:linear-gradient(120deg,var(--t-pri) 0%,var(--t-pri) 34%,var(--p-pri) 34%,var(--p-pri) 100%); border-radius:20px; color:var(--white); padding:56px 24px; text-align:center;}
.levelup h2{font-size:2.6rem; letter-spacing:.02em;}
.levelup p{margin-top:10px; font-size:1.05rem; color:#E1D5F5;}
.stars{font-size:2rem; letter-spacing:.2em; margin:10px 0; color:var(--p-acc);}
.score-big{font-family:'Fredoka'; font-size:3.2rem; color:var(--p-pri);}
.footer-note{font-size:.78rem; color:#78909C; margin-top:34px; text-align:center;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* GRAMMAR QUEST: original practice questions written for this course.
   Topic coverage follows the unit list of Wren and Martin,
   Primary School English Grammar and Composition.
   Bank: 26 questions per topic (16 Year 4, 10 Year 5), 208 total.
   Each round deals a fresh random hand: 8 warm-ups plus 5 challenges. */
const TOPICS=[];
TOPICS.push({id:"nouns",emoji:"🏷️",name:"Nouns",blurb:"Naming words: kinds, plurals and apostrophes",
y4:[
{d:1,q:"Which word in this sentence is a noun? “The kookaburra laughed loudly from the gum tree.”",o:["laughed","loudly","kookaburra","from"],a:2,w:"A noun is a naming word. Kookaburra names an animal (and gum tree is a noun too!)."},
{d:1,q:"Which word needs a capital letter? “We flew to sydney on Friday.”",o:["flew","sydney","on","Friday is the only one"],a:1,w:"Sydney is a proper noun, the special name of a place, so it always gets a capital."},
{d:2,q:"What is the plural of child?",o:["childs","childes","children","childrens"],a:2,w:"Child is an irregular noun: one child, two children."},
{d:2,q:"Pick the collective noun: a ___ of bees.",o:["flock","swarm","herd","school"],a:1,w:"A swarm of bees. Flocks are for birds or sheep, herds for cattle, schools for fish."},
{d:1,q:"One mouse, two ___.",o:["mouses","mice","mices","mouse"],a:1,w:"Mouse changes completely in the plural: mice."},
{d:1,q:"Which word is a noun? “The ferry crossed the harbour quickly.”",o:["crossed","quickly","harbour","the"],a:2,w:"Harbour names a place (and ferry is a noun too)."},
{d:1,q:"Which of these is a proper noun?",o:["dog","puppy","Bluey","animal"],a:2,w:"Bluey is a special name, so it is a proper noun and gets a capital letter."},
{d:2,q:"What is the plural of leaf?",o:["leafs","leaves","leafes","leavs"],a:1,w:"Words ending in f often swap to ves: leaf becomes leaves, wolf becomes wolves."},
{d:2,q:"What is the plural of sheep?",o:["sheeps","sheepes","sheep","shoop"],a:2,w:"Sheep stays the same: one sheep, a hundred sheep. Deer and fish do this too."},
{d:2,q:"Pick the collective noun: a ___ of fish.",o:["school","classroom","swarm","pack"],a:0,w:"A school of fish. Yes, really: fish go to school!"},
{d:3,q:"In “Aunty Rose planted six roses”, which word is a proper noun?",o:["Aunty","Rose","roses","planted"],a:1,w:"Rose (with a capital) is her name. The flowers, roses, are common nouns."},
{d:1,q:"What is the plural of box?",o:["boxs","boxes","boxies","boxen"],a:1,w:"Words ending in x add es: box becomes boxes."},
{d:3,q:"Which word is NOT used as a noun here? “They run to the beach with a kite.”",o:["beach","run","kite","They run past the shop"],a:1,w:"Run is the doing word (verb) in this sentence. Beach and kite are nouns."},
{d:3,q:"The female of bull is...",o:["hen","doe","mare","cow"],a:3,w:"Bull and cow are the male and female pair. Hen goes with rooster, mare with stallion."},
{d:2,q:"The bike belongs to Jack. Which is correct?",o:["Jacks bike","Jacks' bike","Jack's bike","Jack bike's"],a:2,w:"One owner: apostrophe plus s. Jack's bike."},
{d:2,q:"What is the plural of tooth?",o:["tooths","teeth","toothes","teeths"],a:1,w:"Tooth becomes teeth, just like foot becomes feet."}],
y5:[
{d:4,q:"The bowl belongs to two dogs. Which is correct?",o:["the dog's bowl","the dogs' bowl","the dogss bowl","the dogs bowl"],a:1,w:"More than one dog, so the apostrophe goes AFTER the s: the dogs' bowl."},
{d:4,q:"Find the abstract noun: “Her kindness surprised everyone at training.”",o:["Her","kindness","surprised","training"],a:1,w:"Kindness names a quality you cannot touch or see. That makes it abstract."},
{d:4,q:"The library belongs to the children. Which is correct?",o:["the childrens' library","the children's library","the childrens library","the children library's"],a:1,w:"Children is already plural, so the apostrophe plus s goes straight on: children's."},
{d:5,q:"The change room belongs to the men. Which is correct?",o:["the mens' change room","the men's change room","the mens change room","the men change room's"],a:1,w:"Men is already plural (no s to add first), so it takes apostrophe plus s: men's."},
{d:5,q:"What is the noun made from the adjective brave?",o:["bravely","braver","bravery","bravest"],a:2,w:"Bravery names the quality. Bravely is the adverb, braver and bravest compare."},
{d:4,q:"In “a flock of galahs”, flock is which kind of noun?",o:["proper","abstract","collective","possessive"],a:2,w:"A collective noun names a group. Flock collects the galahs into one word."},
{d:4,q:"What is the singular of geese?",o:["goose","geese","goosen","gee"],a:0,w:"One goose, two geese. Same pattern as tooth and teeth."},
{d:5,q:"Find the head noun: “the rusty old ute with a flat tyre”.",o:["rusty","ute","tyre","old"],a:1,w:"Strip away the describers and the phrase: the whole group is really about the ute."},
{d:5,q:"Which sentence uses the apostrophe correctly?",o:["The two team's jerseys were muddy.","The two teams jersey's were muddy.","The two teams' jerseys were muddy.","The two teams jerseys' were muddy."],a:2,w:"Two teams own the jerseys, so the apostrophe goes after the plural s: teams'."},
{d:4,q:"The team belongs to the women. Which is correct?",o:["the womens' team","the women's team","the womans team","the womens team"],a:1,w:"Women is already plural, so apostrophe plus s: women's team."}]});
TOPICS.push({id:"pronouns",emoji:"👉",name:"Pronouns",blurb:"Words that stand in for nouns",
y4:[
{d:1,q:"Choose the pronoun: “Maya lost ___ hat at the beach.”",o:["she","her","hers","herself"],a:1,w:"Her works before a noun: her hat. Hers stands alone."},
{d:2,q:"Which is correct?",o:["Tom and me went fishing.","Tom and I went fishing.","Me and Tom goes fishing.","I and Tom went fishing."],a:1,w:"Remove Tom to test it: “I went fishing” sounds right, “me went fishing” does not."},
{d:2,q:"Choose the demonstrative pronoun: “___ shoes over there are muddy.”",o:["This","That","Those","These here"],a:2,w:"Over there means far away, and shoes is plural, so those is the match."},
{d:1,q:"Choose the question word: “___ is knocking at the door?”",o:["Whom","Who","Whose","Which one of"],a:1,w:"Who asks about a person doing the action."},
{d:2,q:"Which is correct? “The dog wagged ___ tail.”",o:["it's","its","its'","it is"],a:1,w:"Its (no apostrophe) means belonging to it. It's always means it is."},
{d:1,q:"“___ am going to the shops.”",o:["Me","I","Him","Us"],a:1,w:"I is the subject pronoun that pairs with am."},
{d:2,q:"“Nan gave the mangoes to Sam and ___.”",o:["I","me","myself","she"],a:1,w:"Remove Sam to test: “Nan gave the mangoes to me.” Me is the object."},
{d:1,q:"“The skateboard belongs to me. It is ___.”",o:["my","mine","me","myself"],a:1,w:"Mine stands alone at the end of a sentence. My needs a noun after it."},
{d:1,q:"Which pronoun replaces “Ella and Zoe”?",o:["she","her","they","them both is"],a:2,w:"Two people doing something together become they."},
{d:1,q:"“This is my dog. ___ name is Ziggy.”",o:["It's","Its","Its'","It"],a:1,w:"Belonging to the dog: its name. No apostrophe."},
{d:2,q:"“We taught ___ the rules.” (the new kids)",o:["they","their","them","theirs"],a:2,w:"Them is the object pronoun: the teaching happens TO them."},
{d:2,q:"“___ of these caps is yours?”",o:["Who","Which","Whose","What one"],a:1,w:"Which asks the listener to choose from a set of things."},
{d:2,q:"“My sister and ___ built a cubby.”",o:["me","I","us","mine"],a:1,w:"Test alone: “I built a cubby.” I is the subject."},
{d:1,q:"“___ is my seat right here.”",o:["That","Those","This","These"],a:2,w:"Right here means close, and seat is singular: this."},
{d:1,q:"“Give the ball to ___.”",o:["he","him","his","he's"],a:1,w:"Him is the object pronoun: the ball goes TO him."},
{d:3,q:"Fix the repeat: “The twins fed the twins' rabbit.”",o:["The twins fed their rabbit.","The twins fed there rabbit.","The twins fed they're rabbit.","The twins fed its rabbit."],a:0,w:"Their means belonging to them. There is a place; they're means they are."}],
y5:[
{d:4,q:"Choose the reflexive pronoun: “She taught ___ to juggle.”",o:["her","she","herself","hers"],a:2,w:"The action bounces back to the doer, so we need the -self form."},
{d:4,q:"Choose the relative pronoun: “The boy ___ won the race is my cousin.”",o:["which","who","what","whom the"],a:1,w:"Who relates back to a person and joins the two ideas into one sentence."},
{d:4,q:"Which is correct? “___ jumper is this on the oval?”",o:["Who's","Whose","Whos","Who is"],a:1,w:"Whose asks about belonging. Who's is short for who is."},
{d:4,q:"“The players organised ___ into two teams.”",o:["theirselves","themself","themselves","them own"],a:2,w:"Themselves is the plural reflexive. Theirselves is never a word."},
{d:4,q:"“The kite ___ has a red tail is mine.”",o:["who","that","whom","whose"],a:1,w:"That (or which) relates back to a thing. Who is only for people."},
{d:5,q:"“The girl ___ bike was stolen told the office.”",o:["who","which","whose","that"],a:2,w:"Whose shows the bike belongs to the girl, and joins the ideas."},
{d:5,q:"“Between you and ___, the sequel is better.”",o:["I","me","myself","we"],a:1,w:"Between is a preposition, so it takes the object pronoun: me. “Between you and I” is a famous trap."},
{d:5,q:"Spot the error: “Him and I went first.”",o:["should be “Him and me”","should be “He and I”","should be “His and I”","no error"],a:1,w:"Both pronouns are subjects: He went first, I went first, so He and I."},
{d:5,q:"“I baked this pavlova ___!” (all on my own)",o:["itself","meself","myself","mineself"],a:2,w:"Myself adds proud emphasis: I did it with no help."},
{d:4,q:"“When Liam met Arlo, he smiled.” What is the problem?",o:["smiled is the wrong tense","we cannot tell who “he” is","met needs a capital","there is no problem"],a:1,w:"He could mean Liam or Arlo. Pronouns need a clear owner, or the reader gets lost."}]});
TOPICS.push({id:"adjectives",emoji:"🎨",name:"Adjectives & Articles",blurb:"Describing words, a, an and the",
y4:[
{d:1,q:"Find the adjective: “The enormous crocodile slid into the muddy river.”",o:["crocodile","slid","enormous","river"],a:2,w:"Enormous describes the crocodile (and muddy describes the river)."},
{d:1,q:"Choose the article: “We spotted ___ emu near the fence.”",o:["a","an","two an","the an"],a:1,w:"Emu starts with a vowel sound, so it takes an."},
{d:1,q:"Tall, taller, ___?",o:["tallerer","most tall","tallest","more taller"],a:2,w:"Short adjectives add -est for the top level."},
{d:2,q:"Good, better, ___?",o:["goodest","bestest","best","most good"],a:2,w:"Good is irregular: good, better, best."},
{d:2,q:"Choose correctly: “This mango is sweeter than ___ one.”",o:["those","these","that","them"],a:2,w:"One mango, further away: that one. Those and these go with plurals."},
{d:3,q:"Why is it “an honest mistake”?",o:["honest is a long word","the h in honest is silent, so it starts with a vowel sound","mistakes always take an","it is actually wrong"],a:1,w:"We choose a or an by SOUND. Honest sounds like on-est, so it takes an."},
{d:1,q:"Find the adjective of number: “Seven emus crossed the road.”",o:["emus","Seven","crossed","road"],a:1,w:"Seven tells us how many, so it is an adjective of number."},
{d:2,q:"Bad, worse, ___?",o:["baddest","worser","worst","most bad"],a:2,w:"Bad is irregular: bad, worse, worst."},
{d:1,q:"Choose the best adjective: “The lemon pie tasted ___.”",o:["sour","sourly","sourness","soured it"],a:0,w:"Sour describes the pie. Sourly is an adverb, sourness is a noun."},
{d:1,q:"“___ sun rose at six.”",o:["A","An","The","Some"],a:2,w:"There is only one sun we all know, so it takes the."},
{d:1,q:"Which word does hungry describe? “The hungry magpie watched my chips.”",o:["watched","chips","magpie","my"],a:2,w:"Hungry belongs to the magpie. Adjectives lean on their noun."},
{d:2,q:"What is the comparative of happy?",o:["happyer","happier","more happy","happiest"],a:1,w:"Change the y to i and add -er: happier."},
{d:2,q:"“___ apples here are the crunchy ones.”",o:["That","This","These","Those over there"],a:2,w:"Here means close, apples is plural: these."},
{d:3,q:"Find the adjective of quantity: “There is little water in the tank.”",o:["water","tank","little","There"],a:2,w:"Little tells us how much water, so it is an adjective of quantity."},
{d:2,q:"Which is correct?",o:["beautifuller","more beautiful","beautifulest","most beautifuller"],a:1,w:"Long adjectives compare with more and most, not -er and -est."},
{d:3,q:"Which of these is the adjective?",o:["quickly","quick","quicken","quickness"],a:1,w:"Quick describes a noun (a quick runner). Quickly is the adverb, quickness is the noun."}],
y5:[
{d:4,q:"Choose the articles: “I saw ___ echidna at the park. ___ echidna was digging.”",o:["a / A","an / The","the / An","an / A"],a:1,w:"First mention: an echidna (any one). Second mention: the echidna (now we know which)."},
{d:4,q:"Spot the error: “She is the most kindest teacher in the school.”",o:["should be “most kind est”","should be “kindest” (drop most)","should be “more kindest”","no error"],a:1,w:"Never double up superlatives: kindest does the whole job alone."},
{d:4,q:"Little, less, ___?",o:["littlest","lesser","least","most less"],a:2,w:"Little (meaning amount) is irregular: little, less, least."},
{d:5,q:"Pick the natural order: “a ___ kelpie”.",o:["black young clever","clever young black","young black clever","black clever young"],a:1,w:"English quietly orders adjectives: opinion (clever), then age (young), then colour (black)."},
{d:5,q:"Spot the error: “This is a more better plan.”",o:["should be “more good”","should be “better” (drop more)","should be “more betterer”","no error"],a:1,w:"Better is already comparative. Adding more doubles up."},
{d:4,q:"“That was the ___ film of the holidays.”",o:["excitingest","most exciting","more exciting","much exciting"],a:1,w:"Exciting is a long adjective, so it takes most for the superlative."},
{d:5,q:"“I love ___ cricket.” Which article fits?",o:["a","an","the","no article is needed"],a:3,w:"Sports and school subjects usually take no article: I love cricket, I like maths."},
{d:5,q:"“___ students caught the bus today than yesterday.”",o:["Less","Fewer","Least","Small"],a:1,w:"Fewer is for things you can count (students). Less is for amounts (less water)."},
{d:4,q:"“The sausages smell ___.”",o:["good","well","goodly","better than well"],a:0,w:"Smell is a linking verb here, so it takes the adjective good, describing the sausages."},
{d:4,q:"Which is punctuated correctly?",o:["a well known author","a well-known author","a wellknown author","a well, known author"],a:1,w:"Well-known works as one describing word before a noun, so it takes a hyphen."}]});
TOPICS.push({id:"verbs",emoji:"⚡",name:"Verbs & Tenses",blurb:"Doing words and their time travel",
y4:[
{d:1,q:"Find the verb: “The pelican gobbled the fish in one gulp.”",o:["pelican","gobbled","fish","gulp"],a:1,w:"Gobbled is the doing word: what the pelican did."},
{d:1,q:"“Yesterday we ___ to the pool.”",o:["go","goes","went","will go"],a:2,w:"Yesterday sends us into the past: went."},
{d:1,q:"Choose the be verb: “They ___ excited about camp.”",o:["is","am","are","be"],a:2,w:"They is plural, so it pairs with are."},
{d:1,q:"“Tomorrow I ___ visit Nan.”",o:["will","did","was","am"],a:0,w:"Tomorrow means future, and will is our future helper."},
{d:2,q:"“Look! The joey ___ jumping!”",o:["are","is","were","be"],a:1,w:"One joey, happening right now: is jumping."},
{d:2,q:"What is the past tense of swim?",o:["swimmed","swam","swum by itself","swimed"],a:1,w:"Swim is irregular: swim, swam, (has) swum."},
{d:2,q:"“The dogs ___ barking all night.”",o:["was","were","is","am"],a:1,w:"Dogs is plural, and all night is past: were barking."},
{d:2,q:"“I ___ already done my chores.”",o:["has","have","am","was"],a:1,w:"I pairs with have: I have done."},
{d:2,q:"What is the past tense of catch?",o:["catched","caught","cought","catches"],a:1,w:"Catch is irregular: catch, caught."},
{d:1,q:"“He ___ his bike to school every day.”",o:["ride","rides","riding","ridden"],a:1,w:"He takes the s form in the present: he rides."},
{d:1,q:"In “Pass the ball!”, the verb is...",o:["ball","Pass","the","there is no verb"],a:1,w:"Commands start with the verb: Pass."},
{d:2,q:"What is the past tense of begin?",o:["beginned","begun on its own","began","begins"],a:2,w:"Begin, began, (has) begun. Began stands alone; begun needs a helper."},
{d:1,q:"“We ___ watching the storm from the verandah.”",o:["is","am","are","be"],a:2,w:"We is plural: we are watching."},
{d:2,q:"“___ she like mangoes?”",o:["Do","Does","Is","Are"],a:1,w:"She takes does: Does she like...? (Do goes with I, you, we, they.)"},
{d:1,q:"“The kettle ___ boiling.”",o:["are","is","were","been"],a:1,w:"One kettle, right now: is boiling."},
{d:3,q:"“They ___ arrive at noon tomorrow.”",o:["will","would have","was going","did"],a:0,w:"Simple future: will arrive."}],
y5:[
{d:4,q:"“She ___ already finished her homework.”",o:["have","has","is","did"],a:1,w:"Present perfect: has plus finished. She is one person, so has."},
{d:5,q:"In “Ben kicked the ball”, kicked is a transitive verb because...",o:["it happened in the past","it has an object (the ball)","Ben is a proper noun","it is a short word"],a:1,w:"Transitive verbs pass their action onto an object. The ball receives the kick."},
{d:5,q:"“The box of mangoes ___ heavy.”",o:["are","were","is","be"],a:2,w:"The real subject is the box (one box), not the mangoes. The box is heavy."},
{d:4,q:"“I ___ reading when the lights went out.”",o:["was","were","am","is"],a:0,w:"Past continuous: I was reading. The reading was in progress when something happened."},
{d:4,q:"“We ___ lived here since 2023.”",o:["has","have","are","was"],a:1,w:"Present perfect with we: have lived. Since 2023 links the past to now."},
{d:4,q:"“She has ___ all the mangoes!”",o:["ate","eaten","eat","eated"],a:1,w:"After has, use the past participle: eaten. Ate stands alone (She ate lunch)."},
{d:5,q:"In “The sky turned purple”, turned is a...",o:["command","linking verb","noun","preposition"],a:1,w:"Turned links the sky to its new description, purple. Nothing is being physically turned."},

const LEVELS=[["quest","Quest","Warm up in Year 4, then Level Up to Year 5"],
["1","Level 1","Gentle warm-ups"],["2","Level 2","Year 4 core"],["3","Level 3","Tricky Year 4"],
["4","Level 4","Year 5 zone"],["5","Level 5","Top challenge"]];
let state={mode:"quest",screen:"home",topic:null,seg:"y4",qs:[],idx:0,score:0,results:[],roundTotal:0,done:{}};
const $=sel=>document.querySelector(sel);
const app=document.getElementById("app");
const shuffle=n=>{const a=[...Array(n).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sampleQ=(arr,k)=>shuffle(arr.length).slice(0,Math.min(k,arr.length)).map(i=>arr[i]);

function setMode(m){state.mode=m;home();}

function home(){
 state.screen="home";state.topic=null;
 const chips=LEVELS.map(l=>{const sel=state.mode===l[0]?" sel":"";const cls=l[0]==="quest"?"g":(+l[0]>=4?"p":"t");
  return `<button class="lvl ${cls}${sel}" onclick="setMode('${l[0]}')">${l[1]}</button>`;}).join("");
 const desc=LEVELS.find(l=>l[0]===state.mode)[2];
 const cards=TOPICS.map(t=>{const d=state.done[t.id+"|"+state.mode];
  return `<button class="topic" onclick="startTopic('${t.id}')">
   <div class="emoji">${t.emoji}</div><h3>${t.name}</h3><p>${t.blurb}</p>
   ${d?`<div class="done">Best: ${d.score} / ${d.total} ${"★".repeat(d.stars)}</div>`:""}
  </button>`;}).join("");
 app.innerHTML=`
  <div class="topbar"><h1>Grammar Quest</h1><span class="pill gold">208 QUESTIONS</span></div>
  <p class="intro">Pick your level, then pick a topic. <b>Quest</b> gives you the classic run:
  warm up in the <b style="color:var(--t-pri)">Year 4 zone</b>, then unlock the
  <b style="color:var(--p-pri)">Year 5 Level Up round</b>. Or jump straight to any level, even
  <b style="color:var(--p-pri)">Level 5</b>, if you are feeling brave. Every round deals a fresh hand of questions.</p>
  <div class="lvlrow">${chips}</div>
  <p class="lvldesc">${desc}</p>
  <div class="grid">${cards}</div>
  <p class="footer-note">Topics follow the unit list of Wren &amp; Martin, Primary School English Grammar &amp; Composition. All 208 questions written fresh for this course.</p>`;
}

function startTopic(id){
 const t=TOPICS.find(x=>x.id===id);
 state.topic=t;state.score=0;state.results=[];state.idx=0;state.screen="quiz";
 if(state.mode==="quest"){
  state.seg="y4";state.qs=sampleQ(t.y4,8);
  state.roundTotal=state.qs.length+Math.min(5,t.y5.length);
 }else{
  const L=+state.mode,all=t.y4.concat(t.y5);
  let pool=all.filter(q=>q.d===L);
  if(pool.length<6){const near=all.filter(q=>q.d===(L>1?L-1:2));pool=pool.concat(sampleQ(near,6-pool.length));}
  state.seg="lvl";state.qs=sampleQ(pool,8);
  state.roundTotal=state.qs.length;
 }
 question();
}

function segInfo(){
 if(state.seg==="y4")return{purple:false,label:"YEAR 4 ZONE"};
 if(state.seg==="y5")return{purple:true,label:"YEAR 5 LEVEL UP"};
 const L=+state.mode;return{purple:L>=4,label:"LEVEL "+L};
}

function question(){
 const t=state.topic,q=state.qs[state.idx],info=segInfo();
 const dots=state.results.map(r=>`<span class="dot ${r?"right":"wrong"}"></span>`).join("")+
  state.qs.slice(state.results.length).map((_,i)=>`<span class="dot ${i===0?("on"+(info.purple?" purple":"")):""}"></span>`).join("");
 app.innerHTML=`
  <div class="topbar"><h1 style="color:${info.purple?"var(--p-pri)":"var(--t-pri)"}">${t.emoji} ${t.name}</h1>
   <span class="pill ${info.purple?"purple":""}">${info.label}</span></div>
  <div class="progress">${dots}</div>
  <div class="card ${info.purple?"purple":""}">
   <div class="qhead ${info.purple?"purple":"teal"}">Question ${state.idx+1} of ${state.qs.length}</div>
   <div class="question">${q.q}</div>
   <div class="opts">${q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})">${o}</button>`).join("")}</div>
   <div class="why" id="why"></div>
   <div class="center"><button class="btn ${info.purple?"purple":""} hidden" id="next" onclick="next()">Next</button></div>
  </div>
  <div class="center"><button class="btn ghost" onclick="home()">Back to topics</button></div>`;
}

function pick(i){
 const q=state.qs[state.idx],right=i===q.a;
 if(right)state.score++;
 state.results.push(right);
 q.o.forEach((_,k)=>{const b=$("#opt"+k);b.disabled=true;
  if(k===i)b.classList.add(right?"picked-right":"picked-wrong");
  if(k===q.a&&!right)b.classList.add("reveal");});
 const why=$("#why");
 why.className="why "+(right?"good":"oops");
 why.style.display="block";
 why.innerHTML=(right?"<b>Yes! ⭐</b> ":"<b>Nearly!</b> The answer is <b>"+q.o[q.a]+"</b>. ")+q.w;
 $("#next").classList.remove("hidden");
}

function next(){
 state.idx++;
 if(state.idx<state.qs.length){question();return;}
 if(state.seg==="y4"){levelUp();return;}
 finish();
}

function levelUp(){
 app.innerHTML=`
  <div class="levelup">
   <div class="stars">★ ★ ★</div>
   <h2>LEVEL UP!</h2>
   <p>Warm-up done: ${state.score} out of ${state.qs.length}. Now entering the Year 5 zone.</p>
   <p>These ones are harder on purpose. Brave attempts only!</p>
   <button class="btn purple" onclick="startY5()">Bring it on</button>
  </div>`;
}

function startY5(){
 state.seg="y5";state.qs=sampleQ(state.topic.y5,5);state.idx=0;state.results=[];
 question();
}

function finish(){
 const t=state.topic,total=state.roundTotal,s=state.score;
 const stars=s===total?3:(s>=total-3?2:1);
 const msg=s===total?"Perfect round! You did not just answer, you OWNED it.":
  s>=total-3?"So close to perfect. One more run and it is yours.":
  s>=Math.ceil(total/2)?"Solid work! Read the whys, then have another crack.":
  "Every miss taught you something. That is exactly how champions train. Go again!";
 const key=t.id+"|"+state.mode,prev=state.done[key];
 if(!prev||s>prev.score)state.done[key]={score:s,total:total,stars:stars};
 const modeName=state.mode==="quest"?"Quest":"Level "+state.mode;
 app.innerHTML=`
  <div class="card purple center" style="padding:44px 24px;">
   <div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
   <div class="score-big">${s} / ${total}</div>
   <h2 style="color:var(--p-pri); margin:10px 0;">${t.emoji} ${t.name}: ${modeName} complete</h2>
   <p style="max-width:480px; margin:0 auto;">${msg}</p>
   <div>
    <button class="btn purple" onclick="startTopic('${t.id}')">Play again</button>
    <button class="btn" onclick="home()">Choose another topic</button>
   </div>
  </div>`;
}
home();
</script>
<style>
.lvlrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
.lvl{border:2px solid #CFD8DC;background:#FFFFFF;border-radius:999px;padding:9px 18px;font-family:'Fredoka','Comic Sans MS',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;color:#546E7A;transition:transform .1s;}
.lvl:hover{transform:translateY(-2px);}
.lvl.t{color:var(--t-pri);} .lvl.p{color:var(--p-pri);} .lvl.g{color:#B26A00;}
.lvl.sel{border-color:var(--p-acc);background:#FFF8E1;}
.lvldesc{font-size:.9rem;color:#78909C;margin-bottom:16px;}
</style>
</body>
