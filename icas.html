<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Mirror Paper</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#00796B;--fill:#E0F2F1;--acc:#FF7043;--p:#5E35B1;--pf:#EDE7F6;--gold:#FFB300;
--ink:#263238;--bg:#FAFAFA;--green:#43A047;--blue:#1565C0;--bluef:#E3F2FD;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',Verdana,sans-serif;background:var(--bg);color:var(--ink);}
h1,h2,.btn{font-family:'Fredoka','Comic Sans MS',sans-serif;}
.wrap{max-width:840px;margin:0 auto;padding:22px 14px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.topbar h1{color:var(--blue);font-size:1.6rem;}
.pill{background:var(--blue);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.72rem;letter-spacing:.05em;}
.bar{height:10px;background:#E0E0E0;border-radius:99px;margin:10px 0 16px;overflow:hidden;}
.bar div{height:100%;background:var(--blue);border-radius:99px;transition:width .3s;}
.card{background:#fff;border:2px solid var(--bluef);border-radius:16px;padding:20px;margin-bottom:14px;}
.qnum{font-size:.8rem;font-weight:800;color:var(--blue);letter-spacing:.04em;margin-bottom:6px;}
.question{font-size:1.08rem;font-weight:700;line-height:1.55;margin-bottom:14px;white-space:pre-line;}
.art{margin:10px 0 16px;}
.opts{display:grid;gap:9px;}
.opt{background:var(--bluef);border:2px solid transparent;border-radius:12px;padding:12px 14px;font-size:.98rem;font-family:'Nunito',Verdana,sans-serif;text-align:left;cursor:pointer;}
.opt:hover{border-color:var(--blue);}
.opt.selq{border-color:var(--gold);background:#FFF8E1;}
.opt.right{border-color:var(--green);background:#E8F5E9;font-weight:800;}
.opt.wrong{border-color:var(--acc);background:#FBE9E7;}
.opt:disabled{cursor:default;}
.slotrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.slot{min-width:64px;min-height:48px;border:2px dashed #B0BEC5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:#fff;padding:4px 8px;}
.pooltile{font-size:1.4rem;background:var(--bluef);border:2px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;}
.pooltile:hover{border-color:var(--blue);}
.pooltile:disabled{opacity:.35;cursor:default;}
.lbl{font-size:.85rem;font-weight:800;color:#78909C;}
input.num{font-size:1.2rem;padding:10px 14px;border:2px solid #B0BEC5;border-radius:10px;width:160px;font-family:'Nunito';}
.chip{border:2px solid #B0BEC5;background:#fff;border-radius:10px;padding:8px 13px;font-size:1rem;font-weight:800;cursor:pointer;margin:2px;}
.chip.selq{border-color:var(--gold);background:#FFF8E1;}
.why{border-radius:12px;padding:13px 15px;margin-top:14px;font-size:.95rem;display:none;white-space:pre-line;}
.why.good{background:#E8F5E9;border-left:6px solid var(--green);}
.why.oops{background:#FFF3E0;border-left:6px solid var(--acc);}
.btn{border:none;border-radius:999px;padding:11px 26px;font-size:1rem;font-weight:600;cursor:pointer;color:#fff;background:var(--blue);margin-top:14px;margin-right:8px;}
.btn.grey{background:#B0BEC5;} .btn.green{background:var(--green);}
.center{text-align:center;}
.stars{font-size:2rem;color:var(--gold);letter-spacing:.2em;}
.score-big{font-family:'Fredoka';font-size:3rem;color:var(--blue);}
.note{font-size:.78rem;color:#78909C;margin-top:26px;text-align:center;}
.hidden{display:none;}
table.mini{border-collapse:collapse;margin:6px 0;} table.mini td,table.mini th{border:1.5px solid #90A4AE;padding:4px 10px;font-size:.92rem;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* MATHS MIRROR PAPER: 40 original questions written for this course.
   Each question mirrors the SKILL and FORMAT of one question from a
   practice sitting, with fresh numbers, names and pictures. */
function sole(big){const bx=big==="L"?16:54,r=7;let dots="";const xs=[14,26,38,50];
 let small=xs.filter(x=>Math.abs(x-bx)>6).slice(0,4);
 small.forEach((x,i)=>dots+=`<circle cx="${x}" cy="${18-i}" r="4" fill="#546E7A"/>`);
 return `<svg width="70" height="96" viewBox="0 0 70 96"><ellipse cx="35" cy="58" rx="22" ry="34" fill="#546E7A"/><circle cx="${bx}" cy="16" r="${r}" fill="#546E7A"/>${dots}</svg>`;}
function gauge(f){let seg="";for(let k=0;k<4;k++){seg+=`<rect x="${8+k*30}" y="12" width="28" height="20" fill="${k<f?"#43A047":(f-k===0.5&&k===Math.floor(f)?"#fff":"#fff")}" stroke="#546E7A"/>`;}
 if(f%1===0.5){const k=Math.floor(f);seg+=`<rect x="${8+k*30}" y="12" width="14" height="20" fill="#43A047" stroke="#546E7A"/>`;}
 return `<svg width="136" height="44">${seg}<text x="2" y="10" font-size="9">0</text><text x="112" y="10" font-size="9">800</text></svg>`;}
function frac(kind){
 if(kind==="rect28"){let c="";for(let k=0;k<8;k++)c+=`<rect x="${5+k*22}" y="5" width="22" height="40" fill="${k<2?"#8BC34A":"#fff"}" stroke="#37474F"/>`;return `<svg width="190" height="52">${c}</svg>`;}
 if(kind==="circ48"){let c="";for(let k=0;k<8;k++){const a1=k*45*Math.PI/180,a2=(k+1)*45*Math.PI/180;
  c+=`<path d="M40 40 L${40+34*Math.cos(a1)} ${40+34*Math.sin(a1)} A34 34 0 0 1 ${40+34*Math.cos(a2)} ${40+34*Math.sin(a2)} Z" fill="${k%2?"#FFD54F":"#fff"}" stroke="#37474F"/>`;}
  return `<svg width="82" height="82">${c}</svg>`;}
 if(kind==="tri13"){return `<svg width="110" height="86"><polygon points="55,4 105,82 5,82" fill="#fff" stroke="#37474F"/><polygon points="30,44 80,44 105,82 5,82" fill="#F06292" stroke="#37474F" opacity="0"/><polygon points="5,82 105,82 89,58 21,58" fill="#F06292" stroke="#37474F"/><line x1="34" y1="36" x2="76" y2="36" stroke="#37474F"/></svg>`;}
 if(kind==="strips14"){return `<svg width="150" height="52"><rect x="5" y="5" width="55" height="40" fill="#4FC3F7" stroke="#37474F"/><rect x="60" y="5" width="20" height="40" fill="#fff" stroke="#37474F"/><rect x="80" y="5" width="35" height="40" fill="#fff" stroke="#37474F"/><rect x="115" y="5" width="30" height="40" fill="#fff" stroke="#37474F"/></svg>`;}
 return "";}
function layer(n1,n2){let c="";for(let k=0;k<8;k++){c+=`<rect x="${5+(k%4)*20}" y="${5+Math.floor(k/4)*20}" width="20" height="20" fill="${k<n1?"#FFB300":"#fff"}" stroke="#546E7A"/>`;}
 let d="";for(let k=0;k<8;k++){d+=`<rect x="${105+(k%4)*20}" y="${5+Math.floor(k/4)*20}" width="20" height="20" fill="${k<n2?"#FFB300":"#fff"}" stroke="#546E7A"/>`;}
 return `<svg width="200" height="52">${c}${d}<text x="18" y="50" font-size="8">bottom layer</text><text x="122" y="50" font-size="8">top layer</text></svg>`;}
function pshape(kind){
 if(kind==="rect35"){return `<svg width="120" height="76"><rect x="5" y="5" width="105" height="63" fill="#B3E5FC" stroke="#1565C0" stroke-width="2"/></svg>`;}
 if(kind==="rect25"){return `<svg width="120" height="56"><rect x="5" y="5" width="105" height="42" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/></svg>`;}
 if(kind==="stair44"){return `<svg width="96" height="96"><polygon points="5,5 89,5 89,89 68,89 68,68 47,68 47,47 26,47 26,26 5,26" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2"/></svg>`;}
 if(kind==="notch35"){return `<svg width="90" height="120"><polygon points="5,5 68,5 68,110 5,110 5,75 26,75 26,54 5,54" fill="#FFF59D" stroke="#F9A825" stroke-width="2"/></svg>`;}
 return "";}
const QS=[
{t:"order",q:"Ben tested three toys on a seesaw.\nThe robot pushed its side DOWN against the car. Then the car pushed its side DOWN against the duck.\nTap the toys in order from lightest to heaviest.",
 items:["🦆 duck","🚗 car","🤖 robot"],a:["🦆 duck","🚗 car","🤖 robot"],
 w:"Down means heavier. Robot beats car, car beats duck, so the duck is lightest and the robot is heaviest."},
{t:"mc",q:"Ivy had a page with rows of stamps. Every row had the same number of stamps.\nShe peeled some off. Now she can still see one FULL row of 6 stamps, and 4 rows altogether.\nHow many stamps were on the page before she peeled any?",
 o:["20","22","24","26"],a:2,w:"4 equal rows of 6 stamps: 4 x 6 = 24."},
{t:"mc",q:"A town map grid shows: the bakery in the middle, the pool one square up and one square left of the bakery, the oval one square up and one square right, the vet one square down and one square left, and the servo one square down and one square right.\nWhich place is NORTH-WEST of the bakery?",
 o:["pool","oval","vet","servo"],a:0,w:"North is up, west is left. Up-and-left from the bakery is the pool."},
{t:"mc",q:"Ruby counted shells with tally marks:\n卌 卌 ||\nHow many shells did Ruby collect?",
 o:["10","12","13","17"],a:1,w:"Two groups of five (10) plus two singles = 12."},
{t:"mc",q:"There are 47 children at a bake sale. Every child gets one cupcake.\nCupcakes come in trays of 6.\nHow many trays are needed?",
 o:["6","7","8","9"],a:2,w:"47 divided by 6 is 7 remainder 5, so 7 trays are not enough. Round UP: 8 trays."},
{t:"mc",q:"Four ribbons hang from a shelf. Ada's reaches 92 cm below the shelf, Ivy's reaches 88 cm, Noah's 90 cm and Raf's 85 cm.\nWhose ribbon is the longest?",
 o:["Ada","Ivy","Noah","Raf"],a:0,w:"They all start at the same shelf, so the one hanging lowest, 92 cm, is longest: Ada's."},
{t:"mc",q:"Priya built a rocket using solids: a cylinder body, a cube base, two rectangular prism boosters and a sphere porthole.\nWhich of these solids did Priya NOT use?",
 o:["sphere","cylinder","cone","rectangular prism"],a:2,w:"Body, base, boosters and porthole cover cylinder, cube, rectangular prisms and sphere. No cone anywhere."},
{t:"mc",q:"Leo wrote number sentences with two symbols:\ncircle + triangle = 9\ncircle − triangle = 5\ncircle × triangle = 14\nWhich row shows the correct values?",
 o:["circle 6, triangle 3","circle 7, triangle 2","circle 8, triangle 1","circle 5, triangle 4"],a:1,
 w:"7 + 2 = 9, 7 − 2 = 5 and 7 × 2 = 14. All three sentences must work at once."},
{t:"mc",q:"Which picture has one-quarter of its area shaded?",
 o:[frac("rect28"),frac("circ48"),frac("tri13"),frac("strips14")],a:0,html:true,
 w:"The first rectangle has 8 EQUAL parts with 2 shaded: 2 out of 8 equals one-quarter. The others have half shaded or unequal parts."},
{t:"mc",q:"Sports day is on 21 August.\nSam says: “Sports day starts in three weeks.”\nOn what date did Sam say this?",
 o:["31 July","7 August","14 August","11 September"],a:0,w:"Three weeks is 21 days. Count back 21 days from 21 August: 31 July."},
{t:"mc",q:"Three of these prints were made by a LEFT sneaker. Which print was made by the RIGHT sneaker?\n(Hint: check which side the big toe circle is on.)",
 o:[sole("L")+" print 1",sole("L")+" print 2",sole("R")+" print 3",sole("L")+" print 4"],a:2,html:true,
 w:"Print 3 is the mirror image of the others: its big toe sits on the opposite side."},
{t:"mc",q:"Four rockets show their fuel level on a gauge from 0 to 800. Each section of the gauge is 200.\nWhich rocket has exactly 600 fuel?",
 o:[gauge(1)+" rocket A",gauge(2)+" rocket B",gauge(3)+" rocket C",gauge(3.5)+" rocket D"],a:2,html:true,
 w:"Each section is 200, so 600 means exactly 3 of the 4 sections filled: rocket C."},
{t:"mc",q:"Zara had 85 footy cards. She gave 15 to Ben and twice as many to Kim.\nHow many cards did Zara have left?",
 o:["55","45","40","35"],a:2,w:"Kim got twice 15, which is 30. So 85 − 15 − 30 = 40."},
{t:"order",q:"A bag holds fruit tiles: 1 watermelon, 2 oranges, 4 apples and 5 bananas.\nOne tile is picked without looking.\nTap the fruits in order from least likely to most likely.",
 items:["🍉","🍊","🍎","🍌"],a:["🍉","🍊","🍎","🍌"],
 w:"Fewer tiles means less likely: watermelon (1), oranges (2), apples (4), bananas (5)."},
{t:"mc",q:"A box was full with 24 cubes, packed in 2 layers of 12.\nMia took out 10 cubes.\nWhich picture could show the cubes left in the box? (Shaded squares are cubes, seen from above, one grid per layer.)",
 o:[layer(8,6)+" A",layer(8,4)+" B",layer(6,6)+" C",layer(8,8)+" D"],a:0,html:true,
 w:"24 − 10 = 14 cubes left. Picture A shows 8 + 6 = 14. B shows 12, C shows 12, D shows 16."},
];
QS.push(
{t:"mc",q:"Noor started with 60 cards. Each round she dealt out 4 cards.\nAfter rounds 1 to 4 the pack had: 56, 52, 48, 44 cards left.\nHow many cards were left after each of the NEXT two rounds?",
 o:["42 then 40","40 then 36","38 then 34","36 then 30"],a:1,w:"The pattern drops by 4 each round: 44 − 4 = 40, then 40 − 4 = 36."},
{t:"num",q:"Four friends washed cars for charity. Each friend charged the same price per car.\nAna washed 18 cars, Raj 25, Leo 17 and Mia 25.\nMia raised $75.\nHow much did they raise altogether? (Type the number of dollars.)",
 ans:255,w:"Mia: 25 cars for $75 means $3 per car. Total cars: 18 + 25 + 17 + 25 = 85. So 85 × $3 = $255."},
{t:"mc",q:"Four movies are showing:\nRobot Beach 1:40 pm to 3:15 pm\nJungle Quest 2:00 pm to 3:40 pm\nThe Lost Kite 2:10 pm to 4:10 pm\nPuppy Patrol 1:50 pm to 3:35 pm\nWhich movie is the SHORTEST?",
 o:["Robot Beach","Jungle Quest","The Lost Kite","Puppy Patrol"],a:0,
 w:"Robot Beach runs 95 minutes. Jungle Quest 100, The Lost Kite 120, Puppy Patrol 105."},
{t:"mc",q:"A tray holds four solids. Looking from directly above:\nback-left is a cube 🟪, back-right is a square pyramid ❎, front-left is a dome 🔵, front-right is a tent shape 🔺.\nWhich layout shows the view from above?",
 o:["🟪 ❎\n🔵 🔺","❎ 🟪\n🔺 🔵","🔵 🔺\n🟪 ❎","🔺 🔵\n❎ 🟪"],a:0,
 w:"A view from above keeps every solid in the same position: back row on top, front row below."},
{t:"order",q:"A class collected rubbish. The picture graph key says: each bag symbol = 6 bags, each bottle symbol = 2 bottles, each can symbol = 5 cans, each paper symbol = 4 papers.\nThe graph shows 2 bag symbols, 5 bottle symbols, 3 can symbols and 4 paper symbols.\nTap the rubbish types in order from LEAST collected to MOST collected.",
 items:["🛍️ bags","🍾 bottles","🥫 cans","📄 papers"],a:["🍾 bottles","🛍️ bags","🥫 cans","📄 papers"],
 w:"Multiply by the key: bags 2×6=12, bottles 5×2=10, cans 3×5=15, papers 4×4=16. Order: bottles, bags, cans, papers."},
{t:"mc",q:"Marco has a bag of 144 treats for his 2 dogs.\nHe gives each dog 4 treats per day.\nHow many days will the bag last?",
 o:["12","18","24","36"],a:1,w:"2 dogs × 4 treats = 8 treats a day. 144 ÷ 8 = 18 days."},
{t:"multi",k:2,q:"Four shapes are drawn on grid paper.\nClick the TWO shapes that have the same perimeter.",
 o:[pshape("rect35")+" shape A (3 by 5 rectangle)",pshape("rect25")+" shape B (2 by 5 rectangle)",pshape("stair44")+" shape C (4 by 4 staircase)",pshape("notch35")+" shape D (3 by 5 with a notch)"],a:[0,2],html:true,
 w:"A: 2×(3+5)=16. B: 2×(2+5)=14. C: stair steps keep the 4×4 bounding perimeter, 16. D: the notch ADDS 2 units to 16, giving 18. Same pair: A and C at 16."},
{t:"pick2",q:"Robo starts on square C2, facing NORTH (up). Columns are A to F, rows 1 to 7.\nMoves: 2 squares forward, quarter turn clockwise, 2 squares forward, quarter turn anticlockwise, 3 squares forward.\nWhere does Robo finish?",
 g1:["A","B","C","D","E","F"],g2:["1","2","3","4","5","6","7"],a:["E","7"],
 w:"C2 north, forward 2: C4. Turn clockwise: facing east. Forward 2: E4. Turn anticlockwise: facing north. Forward 3: E7."},
{t:"mc",q:"Ali builds L-shaped walls with blocks. Wall 1 uses 5 blocks, wall 2 uses 9 blocks, wall 3 uses 13 blocks.\nHow many blocks does wall 4 need?",
 o:["15","16","17","21"],a:2,w:"The pattern adds 4 each time: 5, 9, 13, then 13 + 4 = 17."},
{t:"mc",q:"Tina is bagging marbles. If she makes groups of 5, there are 2 left over. If she makes groups of 3 or groups of 4, there are none left over.\nWhich of these could be the number of marbles?",
 o:["12","24","36","48"],a:0,w:"The number must divide by 3 and 4 (so by 12): try 12, 24, 36, 48. Only 12 leaves remainder 2 when grouped in 5s."},
{t:"assign",q:"The same amount of juice was poured into three different containers. The top number of each scale is missing.\nThe tall thin bottle filled EXACTLY to the top. The lunchbox filled to half. The esky filled to one quarter.\nAssign the correct top-of-scale number to each container.",
 targets:["tall thin bottle (exactly full)","lunchbox (half full)","esky (one quarter full)"],opts:["250","500","1000"],a:["250","500","1000"],
 w:"The same juice fills the smallest container exactly: 250 mL. Half of 500 is 250, and a quarter of 1000 is 250. Everything matches 250 mL of juice."},
{t:"mc",q:"Tia has invitations to deliver to three friends, then she returns home. Walking times: home to Amy 7 min, home to Ben 4 min, home to Cass 10 min, Amy to Ben 2 min, Amy to Cass 6 min, Ben to Cass 3 min.\nWhat is the LEAST time to visit all three friends and get home?",
 o:["18 minutes","20 minutes","22 minutes","24 minutes"],a:1,
 w:"Best route: home, Amy (7), Ben (2), Cass (3), home (10)? That is 22. Try home, Ben (4), Cass (3), Amy (6), home (7): 20 minutes. Checking every loop, 20 is the least."},
{t:"multi",k:3,q:"Ren has two identical right-angled triangle tiles. She joins them along one matching edge, flipping or turning them if she likes.\nChoose the THREE shapes she can make.",
 o:["a rectangle","a larger triangle","a square","a parallelogram","a five-sided shape","a circle"],a:[0,1,3],
 w:"Joining along the longest side (mirrored) gives a rectangle. Joining along a short side gives a larger triangle, or a parallelogram if one tile is rotated. Two right triangles cannot make a square (unless the triangle is a special half-square), and never a pentagon or circle."},
{t:"num",q:"Kira thought of a three-digit number.\nThe units digit is eight less than the tens digit. The hundreds digit is half the tens digit.\nWhat is Kira's number?",
 ans:480,w:"Units = tens − 8, so tens must be 8 or 9. Half of 9 is not a whole digit, so tens = 8, hundreds = 4, units = 0. The number is 480."}
);
QS.push(
{t:"mc",q:"A cake stall sold: 45 juices at $2 each, 30 muffins at $2.50 each, 25 pies at $3 each and 70 icy poles at $1 each.\nFrom which item did the stall make the MOST money?",
 o:["juice","muffin","pie","icy pole"],a:0,
 w:"Juice 45×$2=$90, muffins 30×$2.50=$75, pies 25×$3=$75, icy poles 70×$1=$70. Juice wins."},
{t:"multi",k:5,q:"Grandad buys FIVE items with a total mass of exactly 3 kg (3000 g).\nClick the five items in his trolley.",
 o:["flour 1 kg","oats 800 g","sugar 500 g","cheese 400 g","chocolate 300 g","apple 150 g","rice 250 g","watermelon 1.6 kg","potatoes 2 kg"],a:[0,1,2,3,4],
 w:"1000 + 800 + 500 + 400 + 300 = 3000 g exactly. Any combination with the big items goes over."},
{t:"mc",q:"The numbers in the shapes follow a rule.\nShape 1: outer numbers 3, 2, 2, 5 and middle 60. Shape 2: outer 2, 2, 2, 4 and middle 32.\nShape 3: outer 4, 2, 1, 3 and middle ?",
 o:["9","24","30","48"],a:1,w:"The middle is the product of the four outer numbers: 3×2×2×5=60 and 2×2×2×4=32. So 4×2×1×3=24."},
{t:"mc",q:"A 2 by 2 sliding puzzle has tiles 1, 2, 3 and one empty space.\nStart: top row 2, empty. Bottom row 1, 3.\nFinish: top row 1, 2. Bottom row 3, empty.\nWhat is the LEAST number of slides?",
 o:["2","3","4","5"],a:1,w:"Slide 2 right, slide 1 up, slide 3 left. Three slides."},
{t:"num",q:"Milo counted 36 fish at the jetty: bream, flathead, whiting and salmon.\nHe counted 10 bream. There were twice as many whiting as flathead. The number of bream was 4 more than the number of flathead.\nHow many salmon did Milo count?",
 ans:8,w:"Flathead = 10 − 4 = 6. Whiting = 2 × 6 = 12. Salmon = 36 − 10 − 6 − 12 = 8."},
{t:"mc",q:"Five students threw a bean bag at a 5-metre line. Their distances: Kai 5.02 m, Ela 4.95 m, Sol 5.06 m, Nia 4.89 m, Ty 5.11 m.\nWho landed NEAREST to the 5-metre line?",
 o:["Kai","Ela","Sol","Nia","Ty"],a:0,
 w:"Distances from 5 m: Kai 0.02, Ela 0.05, Sol 0.06, Nia 0.11, Ty 0.11. Kai is closest."},
{t:"mc",q:"Ade has four digit cards: 2, 5, 0 and 7.\nShe arranges all four to make four-digit numbers.\nHow many numbers greater than 1000 can she make?",
 o:["12","16","18","24"],a:2,
 w:"All arrangements: 4×3×2×1 = 24. Arrangements starting with 0 are not four-digit numbers: 3×2×1 = 6. So 24 − 6 = 18."},
{t:"num",q:"Maria sewed a quilt using 4 large squares and many small squares.\nThe side of a large square is twice the side of a small square.\nThe finished quilt is 7 small squares wide and 7 small squares tall, with the 4 large squares inside it.\nHow many SMALL squares did she use?",
 ans:33,w:"Whole quilt: 7 × 7 = 49 small-square spaces. Each large square covers 2 × 2 = 4 spaces, so 4 large squares cover 16. Small squares: 49 − 16 = 33."},
{t:"num",q:"Farmer Li bought a packet of seeds. She planted one quarter of the seeds in the garden, then half of the REMAINING seeds in pots.\nShe had 600 seeds left over.\nHow many seeds did she buy?",
 ans:1600,w:"After planting a quarter, three quarters remain. Half of that remainder is left: 3/4 × 1/2 = 3/8 of the packet = 600. So the packet held 600 × 8 ÷ 3 = 1600."},
{t:"num",q:"Judy's garden has a path down the middle as a line of symmetry.\nLEFT side flowers: 5. RIGHT side flowers: 3. Exactly 2 flowers on each side already mirror each other perfectly.\nWhat is the minimum number of new flowers Judy must plant so the whole garden is symmetrical?",
 ans:4,w:"Matched pairs need nothing. The 3 unmatched left flowers each need a right-side partner (3), and the 1 unmatched right flower needs a left-side partner (1). Total: 4."},
{t:"mc",q:"A card pattern repeats every 5 cards:\n⭐ 🌙 ☀️ ⚡ 🌙 | ⭐ 🌙 ☀️ ⚡ 🌙 | ⭐ _ ☀️ ...\nWhich card goes in the blank?",
 o:["⭐","🌙","☀️","⚡"],a:1,w:"The blank is the second card of a new repeat, and position 2 of the pattern is always 🌙."}
);
let i=0,score=0,t0=Date.now(),sel=[],ordSel=[];
const app=document.getElementById("app");
const $=s=>document.querySelector(s);
function esc(x){return x;}
function shell(inner){const pc=Math.round(i/QS.length*100);
 app.innerHTML=`<div class="topbar"><h1>Maths Mirror Paper</h1><span class="pill">Q ${i+1} OF ${QS.length}</span></div>
 <div class="bar"><div style="width:${pc}%"></div></div>
 <div class="card"><div class="qnum">QUESTION ${i+1} • score ${score}</div>${inner}
 <div class="why" id="why"></div>
 <div class="center"><button class="btn hidden" id="next" onclick="nxt()">Next</button></div></div>
 <p class="note">Original practice questions modelled on the style of ICAS Mathematics. Take your time, every answer explains itself.</p>`;}
function render(){const q=QS[i];sel=[];ordSel=[];
 let inner=`<div class="question">${q.q}</div>`;
 if(q.t==="mc"){inner+=`<div class="opts">${q.o.map((o,k)=>`<button class="opt" id="o${k}" onclick="mc(${k})">${o.replace(/\n/g,"<br>")}</button>`).join("")}</div>`;}
 if(q.t==="multi"){inner+=`<div class="opts">${q.o.map((o,k)=>`<button class="opt" id="o${k}" onclick="tg(${k})">${o}</button>`).join("")}</div>
  <button class="btn green" id="sub" onclick="subMulti()">Check (choose ${q.k})</button>`;}
 if(q.t==="order"){inner+=`<div class="lbl">Tap the tiles in order:</div>
  <div class="slotrow" id="pool">${q.items.map((it,k)=>`<button class="pooltile" id="p${k}" onclick="pick(${k})">${it}</button>`).join("")}</div>
  <div class="lbl">first → last</div><div class="slotrow" id="slots">${q.items.map((_,k)=>`<span class="slot" id="s${k}"></span>`).join("")}</div>
  <button class="btn grey" onclick="render()">Reset</button><button class="btn green" id="sub" onclick="subOrder()">Check</button>`;}
 if(q.t==="num"){inner+=`<input class="num" id="nin" inputmode="numeric" placeholder="type a number">
  <button class="btn green" onclick="subNum()">Check</button>`;}
 if(q.t==="pick2"){inner+=`<div class="lbl">Column letter:</div><div>${q.g1.map((g,k)=>`<button class="chip" id="g1${k}" onclick="cp(1,${k})">${g}</button>`).join("")}</div>
  <div class="lbl" style="margin-top:8px">Row number:</div><div>${q.g2.map((g,k)=>`<button class="chip" id="g2${k}" onclick="cp(2,${k})">${g}</button>`).join("")}</div>
  <button class="btn green" onclick="subPick2()">Check</button>`;}
 if(q.t==="assign"){inner+=q.targets.map((tg,r)=>`<div class="lbl" style="margin-top:8px">${tg}:</div>
  <div>${q.opts.map((o,k)=>`<button class="chip" id="a${r}_${k}" onclick="ca(${r},${k})">${o}</button>`).join("")}</div>`).join("")+
  `<button class="btn green" onclick="subAssign()">Check</button>`;}
 shell(inner);
 if(q.t==="pick2")sel=[null,null];
 if(q.t==="assign")sel=q.targets.map(()=>null);}
function showWhy(right,q,corrTxt){const w=$("#why");w.className="why "+(right?"good":"oops");w.style.display="block";
 w.innerHTML=(right?"<b>Yes! ⭐ </b>":"<b>Nearly!</b> "+(corrTxt?corrTxt+" ":""))+q.w;
 if(right)score++;const n=$("#next");n.classList.remove("hidden");const s=$("#sub");if(s)s.disabled=true;}
function mc(k){const q=QS[i];document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
 const b=$("#o"+k);b.classList.add(k===q.a?"right":"wrong");if(k!==q.a)$("#o"+q.a).classList.add("right");
 showWhy(k===q.a,q,"");}
function tg(k){const q=QS[i];const b=$("#o"+k);
 if(sel.includes(k)){sel=sel.filter(x=>x!==k);b.classList.remove("selq");}
 else if(sel.length<q.k){sel.push(k);b.classList.add("selq");}}
function subMulti(){const q=QS[i];if(sel.length!==q.k)return;
 document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
 const right=JSON.stringify([...sel].sort())===JSON.stringify([...q.a].sort());
 q.a.forEach(k=>$("#o"+k).classList.add("right"));sel.filter(k=>!q.a.includes(k)).forEach(k=>$("#o"+k).classList.add("wrong"));
 showWhy(right,q,"");}
function pick(k){const q=QS[i];if(ordSel.includes(k)||ordSel.length>=q.items.length)return;
 $("#p"+k).disabled=true;$("#s"+ordSel.length).textContent=q.items[k];ordSel.push(k);}
function subOrder(){const q=QS[i];if(ordSel.length!==q.items.length)return;
 const got=ordSel.map(k=>q.items[k]);const right=JSON.stringify(got)===JSON.stringify(q.a);
 showWhy(right,q,right?"":"Correct order: "+q.a.join(" → ")+".");}
function subNum(){const q=QS[i];const v=parseFloat(($("#nin").value||"").replace(/[^0-9.\-]/g,""));
 const right=v===q.ans;showWhy(right,q,right?"":"The answer is "+q.ans+".");}
function cp(g,k){const q=QS[i];const grp=g===1?q.g1:q.g2;
 grp.forEach((_,j)=>$("#g"+g+j).classList.remove("selq"));$("#g"+g+k).classList.add("selq");sel[g-1]=grp[k];}
function subPick2(){const q=QS[i];if(sel[0]==null||sel[1]==null)return;
 const right=sel[0]===q.a[0]&&sel[1]===q.a[1];
 showWhy(right,q,right?"":"The answer is "+q.a[0]+q.a[1]+".");}
function ca(r,k){const q=QS[i];q.opts.forEach((_,j)=>$("#a"+r+"_"+j).classList.remove("selq"));
 $("#a"+r+"_"+k).classList.add("selq");sel[r]=q.opts[k];}
function subAssign(){const q=QS[i];if(sel.some(x=>x==null))return;
 const right=JSON.stringify(sel)===JSON.stringify(q.a);
 showWhy(right,q,right?"":"Correct: "+q.targets.map((t,r)=>t.split(" (")[0]+" = "+q.a[r]).join(", ")+".");}
function nxt(){i++;if(i<QS.length){render();return;}
 const mins=Math.round((Date.now()-t0)/60000);
 const stars=score>=36?3:(score>=28?2:1);
 const msg=score>=36?"Outstanding! That is top-band form.":score>=28?"Strong work! Review the ones that got away and go again.":
  "Great training run. Every explanation you read makes the next run stronger.";
 app.innerHTML=`<div class="topbar"><h1>Maths Mirror Paper</h1><span class="pill">FINISHED</span></div>
 <div class="card center" style="padding:40px 20px;background:var(--bluef);">
 <div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
 <div class="score-big">${score} / ${QS.length}</div>
 <p style="margin:8px 0;">Time: about ${mins} minute${mins===1?"":"s"}. ${msg}</p>
 <button class="btn" onclick="location.reload()">Start again</button></div>
 <p class="note">Original practice questions modelled on the style of ICAS Mathematics.</p>`;}
render();
</script>
</body>
</html>
